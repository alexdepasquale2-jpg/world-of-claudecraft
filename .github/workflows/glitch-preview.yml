name: Glitch preview deploy

# Builds the static client from this branch and publishes it to Cloudflare
# Pages so the Glitch class can be played offline from a phone browser.
# Needs the CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID repository secrets.

on:
  push:
    branches:
      - deploy/glitch-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glitch-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: glitch-woc
    steps:
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the client
        run: npm run build

      - name: Drop media originals already shipped as hashed copies
        run: node scripts/build_media_manifest.mjs prune

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@3.80.0 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3.80.0 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
